
name: Simple EC2 CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t simple-cicd-app:test .

      - name: Test Application
        run: |
          docker run -d -p 8080:80 --name test-app simple-cicd-app:test
          sleep 3
          curl --fail http://localhost:8080
          docker stop test-app
          docker rm test-app

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd-app
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,TAG
          script: |
            sudo docker pull $IMAGE:$TAG
            sudo docker stop simple-cicd-app || true
            sudo docker rm simple-cicd-app || true
            sudo docker run -d \
              --name simple-cicd-app \
              --restart unless-stopped \
              -p 80:80 \
              $IMAGE:$TAG
            sudo docker ps
            curl --fail http://localhost
